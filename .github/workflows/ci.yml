name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # No DESCRIPTION in this repo, so install what xnat_cli.R needs directly.
      # use-public-rspm above means these resolve to Linux binaries rather than
      # building from source.
      - name: Install R packages
        env:
          # remotes falls back to a PAT bundled in the package, which is shared
          # by every user and routinely rate-limited. Use the job's own token.
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Rscript -e 'install.packages(c("optparse", "remotes"))'
          Rscript -e 'remotes::install_github("bbuchsbaum/xnatR@main", upgrade = "never")'

      - name: Install bats
        run: |
          sudo apt-get update
          sudo apt-get install -y bats

      - name: Run qexec Bash tests
        run: bats qexec/tests

      - name: Python compile checks
        run: python -m py_compile fmriprep/*.py qexec/*.py

      - name: fMRIPrep backend tests
        run: python -m unittest discover -s fmriprep/tests -p 'test_*.py'

      - name: XNAT CLI smoke test
        run: |
          Rscript xnat_cli/xnat_cli.R help
          Rscript xnat_cli/xnat_cli.R help download_files
          # xnatR is loaded on demand, so confirm separately that the commands
          # which need it would get past the availability guard.
          Rscript -e 'stopifnot(requireNamespace("xnatR", quietly = TRUE))'
